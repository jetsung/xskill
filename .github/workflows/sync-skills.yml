name: Sync Skills Index

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时同步一次
    - cron: "0 */6 * * *"

# ---------------------------------------------------------------
# 技能源列表 —— 在此添加 / 删除 / 修改即可
# ---------------------------------------------------------------
env:
  # 从 github.com/<owner>/<repo> 提取短名，如 jetsung/mtrans → mtrans
  REPO: ${{ github.event.repository.name }}

  # 每行一条源：<名称> <地址>；名称可省略，只写地址
  SOURCES: |
    anthropics https://github.com/anthropics/skills
    github https://github.com/github/awesome-copilot
    antfu https://github.com/antfu/skills
    addyosmani https://github.com/addyosmani/agent-skills
    mattpocock https://github.com/mattpocock/skills

# 同一分支仅保留最新一次文档部署，避免旧 run 覆盖新内容
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ### 构建站点（各发布渠道共同依赖）
  build-docs:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # - name: Set up Python
      #   uses: actions/setup-python@v6
      #   with:
      #     python-version: "3.x"

      # - name: Collect skills from sources
      #   env:
      #     SOURCES: ${{ vars.SOURCES || env.SOURCES }}
      #   run: python .github/scripts/collect_skills.py

      - name: Set up XSkill
        run: |
          bash ./site/install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Collect skills from sources
        env:
          SOURCES: ${{ vars.SOURCES || env.SOURCES }}
        run: |
          # 添加源（每行一条：<名称> <地址>；名称可省略，只写地址；# 开头为注释）
          # tr -d '\r'：GitHub 变量中多行值可能带 CR（\r），会残留到 URL 里导致 git ls-remote 失败
          echo "$SOURCES" | tr -d '\r' | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' | while read -r name url _; do
            if [ -n "$url" ]; then
              xskill sources add --name "$name" --url "$url"
            elif [ -n "$name" ]; then
              xskill sources add --url "$name"
            fi
          done
          # 启用缓存
          xskill config --set cache.enabled=true
          # 生成缓存
          xskill cache update
          # 复制缓存到输出目录
          mkdir -p output
          cp ~/.xskill/cache/skills.json output/skills.json
      - name: Fetch mdbook from mdbook branch
        run: |
          git fetch origin mdbook:mdbook || true
          if git show mdbook:man >/dev/null 2>&1; then
            mkdir -p output/man
            git checkout mdbook -- man/
            mv man output/
          fi

      - name: Collect output
        run: |
          cp schemas/*.json output/
          cp -r site/* output/

      # man/ 下部分文件名含冒号等字符，upload-artifact 不允许直接上传；
      # 先打包为单个 tar.gz 再上传
      - name: Pack output
        run: tar -czf docs-site.tar.gz -C output .

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs-site.tar.gz
          retention-days: 1


  ### GitHub Pages
  publish-pages:
    name: Deploy · gh-pages branch
    needs: [build-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Download docs site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: artifact/

      - name: Unpack docs site
        run: |
          mkdir -p site
          tar -xzf artifact/docs-site.tar.gz -C site

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          commit_message: "chore: update skills index [skip ci]"
          cname: ${{ vars.PAGES_DOMAIN }}

  ### SSH Server WEB
  publish-ssh:
    name: Deploy · SSH
    needs: [build-docs]
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download docs site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: artifact/

      - name: Unpack docs site
        run: |
          mkdir -p site
          tar -xzf artifact/docs-site.tar.gz -C site

      - name: Set up SSH
        uses: LuisEnMarroquin/setup-ssh-action@v3.0.0
        with:
          ORIGIN: ${{ secrets.SSH_HOSTNAME }}
          SSHKEY: ${{ secrets.SSH_KEY }}
          NAME: webserver
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USERNAME }}

      - name: Deploy the website
        env:
          WEBROOT: /data/wwwroot/${{ env.REPO }}
        run: |
          # setup-ssh-action 生成的 known_hosts/access 需补一空行，避免 scp 误判
          echo "" >> ~/.ssh/access
          ssh webserver "rm -rf $WEBROOT && mkdir -p $WEBROOT"
          scp -r site/* "webserver:$WEBROOT"

  ### EdgeOne Pages
  publish-edgeone:
    name: Deploy · EdgeOne
    needs: [build-docs]
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      # jobs.<job_id>.if 不可用 secrets，改为在 step 内判断再门控后续步骤
      - name: Check EdgeOne token
        id: cred
        run: |
          if [ -n "$EDGEONE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EDGEONE_API_TOKEN not set, skip EdgeOne deploy"
          fi

      - name: Download docs site
        if: steps.cred.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: artifact/

      - name: Unpack docs site
        if: steps.cred.outputs.present == 'true'
        run: |
          mkdir -p site
          tar -xzf artifact/docs-site.tar.gz -C site

      - name: Set up Node.js
        if: steps.cred.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install EdgeOne CLI
        if: steps.cred.outputs.present == 'true'
        run: npm install -g edgeone

      - name: Deploy to EdgeOne Pages
        if: steps.cred.outputs.present == 'true'
        run: edgeone makers deploy ./site --name "${{ env.REPO }}" --site global --area overseas --token "${{ env.EDGEONE_API_TOKEN }}"
